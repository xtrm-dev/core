name: Semgrep

# SAST scanner — replaces CodeQL on private user-owned repos where GitHub
# Advanced Security is unavailable. Free, runs entirely in CI.
#
# Diff-aware: on PRs, semgrep ci auto-compares HEAD against the base branch
# and only flags NEW findings. Push-to-main uses --baseline-commit against
# the pre-push SHA, so squash-merge commits get the same new-findings-only
# gate without re-flagging pre-existing debt. The weekly schedule covers
# the full-scan use case.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC weekly

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","mercury-lite","xtrm-tools"]') }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # full history for baseline diff

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # semgrep 1.99.0 imports google.protobuf -> google._upb._message, which
          # dies on Python 3.14 with "Metaclasses with custom tp_new are not
          # supported". Self-hosted runners ship 3.14 as python3, so pin the
          # interpreter: 3.12 has supported wheels for the whole chain.
          python-version: "3.12"

      - name: Install semgrep
        run: |
          SEMGREP_VERSION=1.99.0
          python3 -m venv /tmp/semgrep-venv
          # setuptools>=81 dropped pkg_resources, which semgrep's
          # opentelemetry import still needs (cloud images ship new
          # setuptools; self-hosted runners never hit this).
          /tmp/semgrep-venv/bin/pip install --quiet "setuptools<81" "semgrep==${SEMGREP_VERSION}"
          /tmp/semgrep-venv/bin/semgrep --version

      - name: Scan
        run: |
          # Diff-baseline behaviour: only fail on NEW findings vs the baseline
          # (PR base ref, or pre-push SHA on push-to-main). Schedule runs carry
          # no baseline and remain a full-scan audit.
          BASELINE_ARGS=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASELINE_ARGS=(--baseline-commit "origin/${GITHUB_BASE_REF}")
            git fetch --no-tags --depth=200 origin "${GITHUB_BASE_REF}" || true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BASELINE_ARGS=(--baseline-commit "$BEFORE")
            fi
          fi
          /tmp/semgrep-venv/bin/semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/python \
            --config=p/dockerfile \
            --config=p/github-actions \
            --error \
            --skip-unknown-extensions \
            "${BASELINE_ARGS[@]}"
